name: Build and publish tickrecorder image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tickrecorder-docker-publish
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: bizzkpm/tickrecorder
  INFRA_REPOSITORY: AppsByZubin/infrastructure
  INFRA_VALUES_FILE: helm/tickrecorder/values.yaml

jobs:
  build-push-update-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tickrecorder
        uses: actions/checkout@v4

      - name: Set image tag
        shell: bash
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            docker.io/${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tickrecorder
          cache-to: type=gha,mode=max,scope=tickrecorder

      - name: Check out infrastructure
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ secrets.INFRASTRUCTURE_REPO_TOKEN }}
          path: infrastructure

      - name: Update tickrecorder Helm image tag
        working-directory: infrastructure
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" "${INFRA_VALUES_FILE}"
          grep -A3 '^image:' "${INFRA_VALUES_FILE}"
          git diff --check -- "${INFRA_VALUES_FILE}"
          git diff -- "${INFRA_VALUES_FILE}"

      - name: Commit and push Helm image tag
        working-directory: infrastructure
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "${INFRA_VALUES_FILE}"; then
            echo "Tickrecorder Helm image tag is already ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${INFRA_VALUES_FILE}"
          git commit -m "Update tickrecorder image tag to ${IMAGE_TAG}"
          BRANCH="$(git branch --show-current)"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
